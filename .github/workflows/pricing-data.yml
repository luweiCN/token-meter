name: pricing-data

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pricing-data
  cancel-in-progress: true

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 生成 TokenMeter 价格快照
        run: ./scripts/update-pricing.sh

      - name: 验证转换规则与快照解码
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          swift test --filter 'PricingTests|CostCalculatorTests|PricingSnapshotUpdaterTests|TokenMeterDatabaseMigratorTests'

      - name: 生成校验和
        run: |
          version=$(python3 -c 'import json; print(json.load(open("Sources/TokenMeterCore/Resources/litellm-pricing.json"))["schemaVersion"])')
          asset="litellm-pricing-v${version}.json"
          cp Sources/TokenMeterCore/Resources/litellm-pricing.json "$asset"
          shasum -a 256 "$asset" > "$asset.sha256"
          echo "PRICING_ASSET=$asset" >> "$GITHUB_ENV"

      - name: 发布稳定下载地址
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view pricing-data >/dev/null 2>&1; then
            gh release create pricing-data --prerelease --target "$GITHUB_SHA" \
              --title "TokenMeter Pricing Data" \
              --notes "TokenMeter 自动校验的 LiteLLM 价格快照。"
          fi
          gh release upload pricing-data \
            "$PRICING_ASSET" "$PRICING_ASSET.sha256" --clobber
